<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <!-- Spherical shading so the badge looks like it bulges outward -->
    <radialGradient id="dome" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#FFE0C2" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFB27A" stop-opacity="0.15"/>
      <stop offset="0.75" stop-color="#9A3412" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7C2D12" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Glass: soft sheen from the top-left corner, plus a brighter reflection band -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflect" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="160" y2="160">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="196">
      <stop offset="0" stop-color="#FFF8F1"/>
      <stop offset="1" stop-color="#FED7AA"/>
    </linearGradient>
    <!-- Bevel highlight from a light at the top-left, then a shadow underneath -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.9" specularExponent="20" lighting-color="#fff" result="spec">
        <fePointLight x="60" y="20" z="140"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k2="1" k3="1" result="lit"/>
      <feDropShadow in="lit" dx="0" dy="3" stdDeviation="2.5" flood-color="#7C2D12" flood-opacity="0.6"/>
    </filter>
  </defs>
  <defs>
    <!-- Wavy blob: a circle whose radius ripples 7 times around the edge -->
    <path id="blob" d="M234.0,128.0 L235.2,130.8 L236.4,133.7 L237.3,136.6 L238.1,139.6 L238.6,142.6 L238.9,145.6 L238.8,148.5 L238.5,151.5 L237.9,154.4 L236.9,157.2 L235.7,159.9 L234.2,162.5 L232.5,165.0 L230.5,167.4 L228.4,169.6 L226.2,171.7 L223.8,173.7 L221.5,175.6 L219.1,177.5 L216.8,179.2 L214.5,181.0 L212.3,182.8 L210.3,184.6 L208.4,186.4 L206.6,188.3 L204.9,190.3 L203.4,192.4 L202.0,194.6 L200.7,197.0 L199.5,199.5 L198.2,202.0 L197.0,204.7 L195.8,207.4 L194.5,210.1 L193.1,212.8 L191.6,215.5 L189.9,218.1 L188.1,220.6 L186.2,222.9 L184.0,225.0 L181.7,227.0 L179.3,228.6 L176.6,230.0 L173.9,231.1 L171.0,231.9 L168.1,232.4 L165.1,232.7 L162.0,232.7 L159.0,232.5 L155.9,232.1 L152.9,231.6 L149.9,231.0 L147.0,230.3 L144.1,229.6 L141.3,228.9 L138.5,228.2 L135.8,227.7 L133.2,227.3 L130.6,227.1 L128.0,227.0 L125.4,227.1 L122.8,227.3 L120.2,227.7 L117.5,228.2 L114.7,228.9 L111.9,229.6 L109.0,230.3 L106.1,231.0 L103.1,231.6 L100.1,232.1 L97.0,232.5 L94.0,232.7 L90.9,232.7 L87.9,232.4 L85.0,231.9 L82.1,231.1 L79.4,230.0 L76.7,228.6 L74.3,227.0 L72.0,225.0 L69.8,222.9 L67.9,220.6 L66.1,218.1 L64.4,215.5 L62.9,212.8 L61.5,210.1 L60.2,207.4 L59.0,204.7 L57.8,202.0 L56.5,199.5 L55.3,197.0 L54.0,194.6 L52.6,192.4 L51.1,190.3 L49.4,188.3 L47.6,186.4 L45.7,184.6 L43.7,182.8 L41.5,181.0 L39.2,179.2 L36.9,177.5 L34.5,175.6 L32.2,173.7 L29.8,171.7 L27.6,169.6 L25.5,167.4 L23.5,165.0 L21.8,162.5 L20.3,159.9 L19.1,157.2 L18.1,154.4 L17.5,151.5 L17.2,148.5 L17.1,145.6 L17.4,142.6 L17.9,139.6 L18.7,136.6 L19.6,133.7 L20.8,130.8 L22.0,128.0 L23.3,125.3 L24.7,122.6 L26.0,120.0 L27.2,117.4 L28.4,114.9 L29.5,112.4 L30.4,109.9 L31.1,107.4 L31.7,104.9 L32.1,102.3 L32.4,99.7 L32.6,97.0 L32.6,94.2 L32.6,91.4 L32.5,88.5 L32.5,85.5 L32.5,82.4 L32.6,79.4 L32.8,76.3 L33.2,73.3 L33.7,70.2 L34.5,67.3 L35.6,64.5 L36.9,61.8 L38.4,59.2 L40.2,56.9 L42.2,54.7 L44.5,52.8 L46.9,51.1 L49.5,49.5 L52.3,48.2 L55.2,47.1 L58.1,46.2 L61.1,45.3 L64.0,44.6 L67.0,44.0 L69.9,43.4 L72.7,42.8 L75.4,42.2 L78.0,41.5 L80.