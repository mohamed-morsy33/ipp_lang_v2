    <clipPath id="clip"><use href="#blob"/></clipPath>
  </defs>
  <use href="#blob" fill="url(#bg)" stroke="url(#bg)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Dome shading over the whole badge so it bulges as one piece -->
  <use href="#blob" fill="url(#dome)" stroke="none"/>
  <g filter="url(#emboss)">
    <!-- I: serifs are arcs of a circle (r=62) so they curve with the badge -->
    <g fill="none" stroke="url(#glyph)" stroke-width="18">
      <path d="M72.4 77.2 A62 62 0 0 1 143.6 77.2"/>
      <path d="M72.4 178.8 A62 62 0 0 0 143.6 178.8"/>
      <path d="M108 66 V190"/>
    </g>
    <!-- ++ tucked inside the I, beside the stem -->
    <g fill="url(#glyph)">
      <path d="M128 124 H137 V115 H145 V124 H154 V132 H145 V141 H137 V132 H128 Z"/>
      <path d="M158 124 H167 V115 H175 V124 H184 V132 H175 V141 H167 V132 H158 Z"/>
    </g>
  </g>
  <!-- Glass layers on top of everything -->
  <use href="#blob" fill="url(#sheen)"/>
  <path clip-path="url(#clip)" fill="url(#reflect)" fill-rule="evenodd" d="M0 0 H256 V256 H0 Z M325 190 A150 150 0 1 0 25 190 A150 150 0 1 0 325 190 Z"/>
  <use href="#blob" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="3" clip-path="url(#clip)"/>
</svg>
